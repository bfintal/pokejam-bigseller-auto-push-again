# journald configuration for the pokejam-bigseller-auto-push service namespace
# This file is installed to /etc/systemd/journald@pokejam.conf
# It limits log storage for this service only, without affecting other services.

[Journal]
# Store logs persistently (not just in RAM)
Storage=persistent

# Maximum disk space for this namespace's logs: 50 MB
# Old entries are automatically deleted when this limit is reached
SystemMaxUse=50M

# Keep logs for at most 7 days
# Entries older than this are automatically deleted
MaxRetentionSec=7day

# Compress logs to save space
Compress=yes

# Individual log file max size (smaller = more frequent rotation)
SystemMaxFileSize=8M
